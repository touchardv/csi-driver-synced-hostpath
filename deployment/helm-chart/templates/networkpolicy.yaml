{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: csi-synced-hostpath-fileserver-policy
  namespace: kube-system
spec:
  podSelector:
    matchLabels:
      app: csi-synced-hostpath-controller
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: {{ .Values.fileServer.service.port }}
      from:
        - podSelector:
            matchLabels:
              app: csi-synced-hostpath-node
{{- end }}

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: csi-integration-test-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: synced-hostpath
---
apiVersion: batch/v1
kind: Job
metadata:
  name: csi-test-writer
spec:
  template:
    metadata:
      labels:
        test-role: writer
    spec:
      containers:
        - command: ["sh", "-c", "echo 'CSI_INTEGRATION_TEST_PASSED' > /data/test.txt && sha256sum /data/test.txt > /data/test.sha256 && echo 'Data written successfully'"]
          image: alpine
          name: writer
          volumeMounts:
            - mountPath: /data
              name: test-volume
      restartPolicy: Never
      volumes:
        - name: test-volume
          persistentVolumeClaim:
            claimName: csi-integration-test-pvc
